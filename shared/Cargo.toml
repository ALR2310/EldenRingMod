[package]
name = "common"
version = "1.0.0"
edition = "2024"
publish = false

# Does depend on `eldenring`/`fromsoftware-shared` (for task_hook/alloc_hook/
# task/player/reload - see lib.rs doc comment for why they live here despite
# that, after briefly being a separate `engine` crate) - a mod that never
# touches those modules (e.g. weightmultiplier) still only links whatever it
# actually calls into its final .dll (LTO strips the rest), it just also
# compiles this dependency once.
[dependencies]
chrono.workspace = true
eldenring.workspace = true
fromsoftware-shared.workspace = true
vtable-rs.workspace = true
