[workspace]
resolver = "2"
members = [
    "shared",
    "crates/autoregen",
    "crates/sometweaks",
    "crates/passiverunes",
    "crates/runemultiplier",
    "crates/weightmultiplier",
    "crates/risearcher",
    "crates/dropmultiplier",
    "crates/infiniteailment",
    "crates/soulsteleport",
    "crates/spiritmultiplier",
    "crates/fasterrevival",
    "crates/windowresize",
    "crates/speedmultiplier",
]

[workspace.dependencies]
# https://github.com/vswarte/fromsoftware-rs - Rust bindings to the game's engine
# structs. Same rev for both crates so every mod builds against one version.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Fake C++ vtable for registering a Rust closure as a game task
vtable-rs = "0.1.5"
# TOML config (common::toml_config): typed parse via serde, comment-preserving
# "add missing keys from the template" via toml_edit.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[profile.release]
lto = true
codegen-units = 1
