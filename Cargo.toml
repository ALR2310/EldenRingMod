[workspace]
resolver = "2"
members = ["shared", "crates/autoregen", "crates/sometweaks", "crates/passiverunes", "crates/runemultiplier", "crates/weightmultiplier", "crates/risearcher"]

[workspace.dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "e0948c8d64594b79785e9490877baacea5605a9d" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "e0948c8d64594b79785e9490877baacea5605a9d" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1