[package]
name = "engine"
version = "1.0.0"
edition = "2024"
publish = false

# Unlike `common`, this crate DOES depend on `eldenring`/`fromsoftware-shared`
# on purpose - it's the shared layer for code that talks to the game's own
# reflected engine types, just written so no single mod owns it and every
# other mod copy-pastes from. See src/lib.rs for what's in it and why.
[dependencies]
common = { path = "../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true
vtable-rs.workspace = true
