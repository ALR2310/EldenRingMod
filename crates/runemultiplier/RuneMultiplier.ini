[Settings]

; Key that reloads this file in-game.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5

; Multiplies rune gains only - spending (leveling up, shops) is untouched.
Multiplier=2.0


[Logging]
; Write RuneMultiplier.log next to the DLL (for troubleshooting). Off = no log file
LogFile=false
