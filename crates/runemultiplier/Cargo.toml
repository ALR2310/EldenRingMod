[package]
name = "runemultiplier"
version = "1.0.4"
edition = "2024"
publish = false

[lib]
name = "RuneMultiplier"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true
chrono.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Rune Multiplier"
FileDescription = "Rune Multiplier - Elden Ring mod"
InternalName = "RuneMultiplier"
OriginalFilename = "RuneMultiplier.dll"
