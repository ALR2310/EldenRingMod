[General]
; Key that reloads this config file while the game is running, so you don't
; have to restart to test changes.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5

[Regen Per Tick]
; Enable/disable this feature
Regen.PerTick.Enabled=true

; When this tick regen is allowed to apply
; 0 = Always
; 1 = Only while out of combat
; 2 = Only while in combat
; 3 = Only while idle (no movement/attack/item/guard/mount for 5+ seconds)
; 4 = Only while a gesture from Regen.PerTick.GestureId below is active
Regen.PerTick.Trigger=0

; Which gestures count for Trigger=4 above - not just "sitting", any gesture
; listed here works. Default list: Dejection, Patches' Crouch, Crossed Legs,
; Rest, Sitting Sideways, Dozing Cross-Legged, Spread Out, Balled Up, Prayer,
; Desperate Prayer. Values here are HALF the GESTURE_ID shown at
; https://github.com/The-Grand-Archives/Elden-Ring-CT-TGA
Regen.PerTick.GestureId=80,90,91,92,93,94,95,97,100,101

; How often it triggers, in milliseconds. Example: 1000=1 second, 5000=5
; second. Lower values tick faster but cost more performance.
Regen.PerTick.Interval=1000

; Value type for the values below. 0 = points, 1 = percent of max, 2 = percent
; of the amount currently missing (max - current)
; 0 = points, e.g. HP=1 restores 1 Hp point per tick
; 1 = percent of max, e.g. HP=1 restores 1% of max Hp per tick, same amount
;     no matter how low or high current Hp already is
; 2 = percent of missing Hp, e.g. HP=5 restores 5% of (max Hp - current Hp)
;     per tick - heals fast while low, tapers off as it approaches max
Regen.PerTick.ValueType=1

; Amount restored per tick
Regen.PerTick.HP=0.5
Regen.PerTick.FP=1
Regen.PerTick.SP=5

; Max percent of a stat's true max that tick regen will restore it to.
; 100 (default) = no ceiling. Example: Cap=80 stops healing once at 80% max.
Regen.PerTick.Cap=100


[Regen Per Hit]
; Enable/disable this feature
Regen.PerHit.Enabled=false

; 0 = Restore a fixed number of points every time you land a hit.
; 1 = Restore a percent of your max stat every time you land a hit.
; 2 = Restore a percent of the damage you just dealt every time you land a
;     hit.
; Suggested balanced values:
;   0: HP=15, FP=5, SP=5
;   1: Assuming ~1500 max Hp, ~130 max Fp/SP (mid-game):
;       HP=1 (~15 Hp/hit), FP=4 (~5 Fp/hit), SP=4 (~5 SP/hit).
;   2: Assuming ~200 damage/hit (mid-game):
;       HP=7.5 (~15 Hp/hit), FP=2.5 (~5 Fp/hit), SP=2.5 (~5 SP/hit).
Regen.PerHit.Mode=0

; Which hits count at all, regardless of Trigger above
; 0 = Melee weapon hits only
; 1 = Ranged/spell hits only
; 2 = Both
Regen.PerHit.DamageType=0

; When true, Weapon Art/Ash of War hits don't restore anything
Regen.PerHit.ExcludeAow=false

; Amount restored per hit
Regen.PerHit.HP=0.5
Regen.PerHit.FP=1
Regen.PerHit.SP=5


[Logging]
; Verbose logging to the log file
LogFile=true
