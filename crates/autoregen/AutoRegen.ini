[General]
; Key that reloads this config file while the game is running, so you don't
; have to restart to test changes.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5

; Restores Hp/Fp/Stamina automatically over time, like a passive regen buff -
; every Interval milliseconds, you get healed a bit.
[Regen Per Tick]

; When this tick regen is allowed to apply:
; 0 = Always - heals whether you're in combat or not.
; 1 = Out of combat only - only while idle/resting/exploring with no enemy
;     engaging you; stops the moment you're in a fight.
; 2 = In combat only - the opposite: only heals while you're fighting.
; Example: Condition=1 gives you a "walking around" regen that pauses during
; boss fights instead of trivializing them.
Condition=0

; How often the healing below happens, in milliseconds. 1000 = once a second.
; Set to 0 to turn this whole section off.
Interval=1000

; Restore this many points every tick, no matter your max stat.
; Example: Hp=5 heals 5 Hp every tick, whether your max Hp is 500 or 2000.
Hp=0
Fp=0
Stamina=0

; Restore this percent of your max stat every tick, on top of the flat amount
; above. Example: HpPct=0.5 with 1000 max Hp heals 5 Hp every tick (0.5%).
HpPct=0.5
FpPct=1
StaminaPct=5


; Restores Hp/Fp/Stamina instantly whenever you land a hit on an enemy - a
; reward for attacking, like lifesteal.
[Regen Per Hit]

; How the Pct fields below (HpPctOnHit/FpPctOnHit/StaminaPctOnHit) are
; calculated:
; 0 = Fixed - percent of your max stat, same as Regen Per Tick's HpPct. Works
;     together with the flat HpOnHit/FpOnHit/StaminaOnHit fields below.
; 1 = Based on damage dealt - percent of the damage you just dealt instead of
;     your max stat (true lifesteal, scales with how hard you hit). In this
;     mode the flat HpOnHit/FpOnHit/StaminaOnHit fields are not used - only
;     the Pct fields apply.
Trigger=0

; Flat points restored per successful hit. Only used when Trigger=0.
; Example: HpOnHit=10 heals 10 Hp every time you hit an enemy.
HpOnHit=0
FpOnHit=0
StaminaOnHit=0

; Meaning depends on Trigger above:
; Trigger=0: percent of your max stat. Example: HpPctOnHit=0.5 with 1000 max
;            Hp heals 5 Hp per hit (0.5%).
; Trigger=1: percent of the damage just dealt. Example: HpPctOnHit=0.5, you
;            deal 100 damage -> +50 Hp on that hit.
HpPctOnHit=0
FpPctOnHit=0
StaminaPctOnHit=0


[Debug]

; Writes detailed activity logs to the mod's log file. Only turn this on
; while troubleshooting - it's noisy.
DebugLog=false
