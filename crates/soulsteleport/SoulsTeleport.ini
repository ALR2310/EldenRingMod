[Menu]
; Key that opens / closes the teleport menu. Default 0x09 = Tab.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
MenuKey=0x09

; Menu size multiplier (0.5 - 3.0). Restart the game after changing it.
MenuScale=1.0

; Menu position and size, saved automatically. -1 = default.
MenuX=-1
MenuY=-1
MenuWidth=-1
MenuHeight=-1


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
