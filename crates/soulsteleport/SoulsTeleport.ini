[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Teleport]
; Saves your current map block + position.
SaveKey=F7

; Warps (with a loading screen) back to the saved block + position.
WarpKey=F8

; Logs every player the game currently has loaded (you + co-op partners).
ListPlayersKey=F9


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
