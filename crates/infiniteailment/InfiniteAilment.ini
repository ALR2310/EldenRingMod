[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Scarlet Rot]
; Damage-over-time duration in seconds, -1 = infinite. Vanilla: 90
ScarletRot.Duration=-1

; Percent of max HP dealt per tick. Vanilla: 0.18 (0.33 for some incantations/items)
ScarletRot.PercentDamage=0.18

; Flat damage per tick, added on top. Vanilla: 15
ScarletRot.FixedDamage=15


[Poison]
; Same settings as Scarlet Rot, for Poison.
; Vanilla: 90 / 0.07 / 7
Poison.Duration=-1
Poison.PercentDamage=0.07
Poison.FixedDamage=7


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
