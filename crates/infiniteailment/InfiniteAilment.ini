[General]
; Key that reloads this config file while the game is running, so you don't
; have to restart to test changes.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Scarlet Rot]

; How long Scarlet Rot's damage-over-time lasts, in seconds, once
; triggered on an enemy.
; Set to -1 for infinite duration.
; Vanilla: 90
ScarletRot.Duration=-1

; Percent-of-something damage dealt per tick. Vanilla splits rows between
; 0.18 (weapons/build-up ranks) and 0.33 (incantations/some items) - this
; overrides every row to the same value.
ScarletRot.PercentDamage=0.18

; Flat damage dealt per tick, on top of PercentDamage.
; Vanilla: 15
ScarletRot.FixedDamage=15


[Poison]

; Same 3 settings as [ScarletRot] above, applied to Poison instead.
; Vanilla: 90
Poison.Duration=-1

; Vanilla: 0.07
Poison.PercentDamage=0.07

; Vanilla: 7
Poison.FixedDamage=7


[Logging]
; Write InfiniteAilment.log next to the DLL (for troubleshooting). Off = no log file
LogFile=true
