[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Settings]
; Pick one adjustment mode:
; 0 = Multiplies an item's drop chance. E.g. a 1% item with x3 becomes 3%.
; 1 = Sets an item's drop chance to a fixed value. E.g. a 1% item set to
;     50 becomes 50%, and a 100% item set to 50 also becomes 50%.
Mode=0

; Drop-rate multiplier - only used when Mode=0. Set to 1 for vanilla.
Multiplier=3

; Fixed drop chance - only used when Mode=1. Set to 100 to guarantee a drop.
ChancePercent=30


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
