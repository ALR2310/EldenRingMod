[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Death]
; Skip waiting for the death animation to finish before the "YOU DIED"
; screen: the game registers the death as soon as the animation starts.
; The animation itself still plays.
FastDeath=true

; Key that flips FastDeath on/off in-game (shows a banner), to compare
; both back to back. Pressing ReloadKey goes back to the value above.
ToggleKey=F6


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true

; Logs the player's death animation (anim ID, play time, length, whether
; the game has registered the death yet) from the moment HP hits 0 until
; respawn. Research aid.
DeathProbe=true