[General]
; Key that reloads this file while the game is running.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Regen Per Tick]
; Enable/disable this feature
Regen.PerTick.Enabled=true

; Activation condition
; 0 = Always active
; 1 = Only while idle, out of combat
; 2 = Only while in combat
Regen.PerTick.Trigger=0

; Tick interval in milliseconds, e.g. 1000=1s, 500=0.5s - lower is faster
; but costs more.
Regen.PerTick.Interval=1000

; Unit for the values below. 0 = flat points, 1 = percent
; 0 = flat, e.g. HP=1 heals 1 point per tick
; 1 = percent, e.g. HP=1 heals 1% of max HP per tick
Regen.PerTick.Unit=1

; Amount healed per tick
Regen.PerTick.HP=0.5
Regen.PerTick.FP=1
Regen.PerTick.Stamina=5


[Regen Per Hit]
; Enable/disable this feature
Regen.PerHit.Enabled=false

; 0 = Heal a flat amount per hit landed.
; 1 = Heal a percent of your max stat per hit landed.
; 2 = Heal a percent of damage dealt per hit landed.
; Suggested values:
;   0: HP=7, FP=3, Stamina=5
;   1: assuming mid-game ~1500 HP, ~130 FP/Stamina:
;       HP=2 (~30 Hp/hit), FP=5 (~6.5 Fp/hit), Stamina=5 (~6.5 Stamina/hit).
;   2: assuming ~200 damage/hit:
;       HP=10 (~20 Hp/hit), FP=5 (~10 Fp/hit), Stamina=5 (~10 Stamina/hit).
Regen.PerHit.Trigger=0

; Amount healed
Regen.PerHit.HP=0.5
Regen.PerHit.FP=1
Regen.PerHit.Stamina=5


[Rune Reward]
; Enable/disable this feature
Rune.Passive.Enabled=true

; Tick interval in milliseconds, e.g. 1000=1s, 500=0.5s
Rune.Passive.Interval=10000

; Runes gained per tick
Rune.Passive.Amount=100

; Milestone bonuses, format (seconds:rune)
; Default: 30m=5000, 1h=10000, 2h=25000, 3h=40000, 6h=100000, 12h=500000, 24h=1000000
; Leave empty to disable
Rune.Milestone=1800:5000,3600:10000,7200:25000,10800:40000,21600:100000,43200:500000,86400:1000000

; Rune gain multiplier from all sources.
; Default doubles runes gained. Set to 1 for vanilla.
Rune.Multiplier=2


[Drop Rate]
; Enable/disable this feature
DropRate.Enabled=true

; Pick one adjustment mode:
; 0 = Multiplier (DropRate.Multiplier) - rare items stay rarer than common
;     ones after scaling, keeps the game's original relative odds.
; 1 = Fixed percent (DropRate.ChancePercent) - flattens every enemy to the
;     same drop chance, regardless of how rare/common it originally was.
DropRate.Mode=0

; Item drop-rate multiplier on kill - only used when Mode=0.
; Default doubles every item's drop chance (approximate, not exact - error
; shrinks as the item gets rarer). Set to 1 for vanilla.
DropRate.Multiplier=3

; Forces every enemy's combined "drops something" chance to this % - only
; used when Mode=1. E.g. 50 makes a 1%-drop enemy and a 90%-drop enemy both
; exactly 50% - if an enemy drops multiple items, their RELATIVE odds
; against each other stay the same, only the group's total is forced.
; Set to 100 to guarantee a drop every time.
DropRate.ChancePercent=30


; [Spirit]
; ; Number of spirits summoned per cast, capped at 10
; Spirit.Summon.Amount=0

; ; Spirit-count multiplier, still capped at 10 total
; ; E.g. 3 Lone Wolves with a multiplier of 2 summons 6 wolves
; Spirit.Summon.Multiplier=1

; ; Allow summoning spirits anywhere
; Spirit.Summon.Anywhere=true

; ; Give spirits their natural color instead of ghostly white
; Spirit.Color=true

; ; Regen spirits' HP every second, 0 disables this
; Spirit.Regen=0.75


[Misc]
; Equip load multiplier.
; Default reduces current equip load by 50%. Set to 1 for vanilla.
WeightMultiplier=0.5

; ; Allow summoning Torrent anywhere, without area restrictions.
; TorrentAnywhere=true


[Debug]
; Log for debugging purposes
DebugLog=true

; Log for the Regen module
RegenLog=true

; Log for the Rune Reward module
RuneLog=true
