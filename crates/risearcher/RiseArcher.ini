[Bow]
; Bow/Greatbow (EquipParamWeapon weaponCategory=10). NPC-only duplicate rows
; (sortId=9999999) are always skipped, never buffed.
DamageMultiplier=1.5
ScalingMultiplier=2
AllowAshOfWar=true

[Crossbow]
; Crossbow only, not Ballista (weaponCategory=11, wepType=55).
DamageMultiplier=3

[Ballista]
; weaponCategory=11, wepType=56.
DamageMultiplier=4

[BowCrossbowBallista]
; Applies to Bow + Crossbow + Ballista together (weaponCategory=10|11).
WeightMultiplier=0.5
SellValueMultiplier=2

[Arrow]
; weaponCategory=13. Vanilla max is 99; hard cap is 255.
MaxQuantity=255

[Bolt]
; weaponCategory=14 (bolt + ballista bolt/greatbolt). Vanilla max is 99; hard cap is 255.
MaxQuantity=255

[Bullet]
; Tuning for the Arrow/Great Arrow/Radahn's Spear/Bolt projectiles (the
; Bullet param, not EquipParamWeapon) - see README for the exact ID list
; this applies to.
SpeedMultiplier=3.5
RangeMultiplier=2
SpreadMultiplier=2
RainOfArrowsCount=6

[Debug]
DebugLog=false
