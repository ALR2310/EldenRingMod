[Window]
; Let the game window be resized by dragging its edges (windowed mode only).
Resizable=true

; Keep the game area at this aspect ratio while dragging.
; Set either value to 0 to resize freely.
AspectWidth=16
AspectHeight=9

; Smallest game area (in pixels) the window can be dragged down to.
MinWidth=160
MinHeight=90


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
