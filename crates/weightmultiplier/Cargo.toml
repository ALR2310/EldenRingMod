[package]
name = "weightmultiplier"
version = "2.0.1"
edition = "2024"
publish = false

[lib]
name = "WeightMultiplier"
crate-type = ["cdylib"]

# No eldenring/fromsoftware-shared dependency - unlike the other mods, this
# one never reads/writes a reflected game struct or watches a hotkey on the
# game's own task scheduler. It's a one-shot code patch applied from a plain
# worker thread, exactly like the original C++ WeightEngine::Run.
[dependencies]
common = { path = "../../shared" }

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Weight Multiplier"
FileDescription = "Weight Multiplier - Elden Ring mod"
InternalName = "WeightMultiplier"
OriginalFilename = "WeightMultiplier.dll"
