[package]
name = "speedmultiplier"
version = "1.1.0"
edition = "2024"
publish = false

[lib]
name = "SpeedMultiplier"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Speed Multiplier"
FileDescription = "Speed Multiplier - Elden Ring mod"
InternalName = "SpeedMultiplier"
OriginalFilename = "SpeedMultiplier.dll"
