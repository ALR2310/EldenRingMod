[General]
# ; Key that reloads this config file in-game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"


[Speed]
# All player actions. Any value other than 1 overrides every
# Player* key below.
PlayerAll = 1.0

# walking, running, sprinting
PlayerMovement = 1.2

# rolling, backstepping
PlayerRoll = 1.1

# normal attacks
PlayerAttack = 1.2

# Ashes of War / weapon skills
PlayerSkill = 1.2

# casting sorceries and incantations
PlayerCast = 1.2

# using items: flasks, consumables, throwables...
PlayerItem = 1.0

# any action not covered by the keys above,
# e.g. resting at a grace, gestures...
PlayerOther = 1.0

# Torrent speed.
Torrent = 1.3


# Override: different speeds while the player has a SpEffect.
# Remove the "# " in front of the lines below to use it, and add as
# many [[Override]] blocks as you like.
#
# SpEffect: one id, or a list - on while the player has ANY of them.
# Then any of the [Speed] keys above; the ones left out keep their
# [Speed] value.
# When several overrides are on and set the same key, the lowest one
# in the file wins.
#
# [[Override]]
# SpEffect = [1234, 1235]
# PlayerRoll = 1.5
# PlayerMovement = 1.4


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true

# Logs every animation the player plays
SpeedProbe = false

# Logs the player's SpEffect ids when they change
EffectProbe = false
