[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Spirit]
; Spirit-count multiplier: an Ash that normally summons 3 with a
; multiplier of 2 summons 6. Capped at MaxSpirits per Ash. Set to 1 for
; vanilla. Only used when Amount=0.
Multiplier=2

; Number of spirits every Ash summons, regardless of its normal count.
; Capped at MaxSpirits. Set 0 to use Multiplier instead.
Amount=0

; Max spirits per Ash (60-1000). Above 60 at your own risk:
; lower FPS, possible crash. 
; Applied once at startup (no hot-reload)
MaxSpirits=60

; Ghostly blue tint on summoned spirits. true = vanilla look,
; false = remove it (spirits look like normal characters).
GhostColor=false

; Percent of max HP healed per second for every summoned spirit
Regen=0.5


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true

; Logs the spirit summon slot layout
SlotProbe=false

; Logs nearby enemies (load/update state) when it changes
EnemyProbe=false

; !!! DO NOT CHANGE THIS VALUE !!!
; forces a fixed limit on characters active at once
ActiveCharacterLimit=0
