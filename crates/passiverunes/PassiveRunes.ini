[PassiveRunes]

; How often (seconds) runes are added.
IntervalSeconds=5

; Runes added per interval.
RunesPerInterval=25

; Grant bonus runes at time milestones.
EnableMilestones=true

; Write PassiveRunes.log next to the DLL. Off by default.
EnableLog=false

; Milestones as comma-separated "seconds:bonus" pairs.
Milestones=1800:5000,3600:10000,7200:25000,10800:40000,21600:100000,43200:500000,86400:1000000
