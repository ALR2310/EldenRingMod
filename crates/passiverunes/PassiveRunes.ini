[General]
; Key that reloads this config file in-game, no restart needed.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey=F5


[Rune Reward]
; Enable/disable this feature
Rune.Passive.Enabled=true

; How often it triggers, in milliseconds. Example: 1000=1 second.
Rune.Passive.Interval=10000

; Fixed amount of runes granted per interval
; Range: -999999999 to 999999999 (negative takes runes away)
; Default: 50
Rune.Passive.Amount=50

; Percent of the runes needed for your next level, granted per interval
; Range: -100 to 100 (negative takes runes away)
; Default: 0.25
; Suggested: 0.2 to 0.5
Rune.Passive.Percent=0.25

; Percent of the runes you're currently holding, granted per interval
; (compound interest). Grows fast
; Range: -100 to 100 (negative takes runes away)
; Default: 0
; Suggested: 0.05 to 0.1
Rune.Passive.Interest=0

; Bonus runes at time milestones, formatted as (seconds:runes)
; Default: 30m=5000, 1H=10000, 2H=25000, 3H=40000, 6H=100000, 12H=500000...
; Leave empty to disable the milestone bonuses
Rune.Milestone=1800:5000,3600:10000,7200:25000,10800:40000,21600:100000,43200:500000,86400:1000000


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=false
