[package]
name = "spiritmultiplier"
version = "1.2.2"
edition = "2024"
publish = false

[lib]
name = "SpiritMultiplier"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Spirit Multiplier"
FileDescription = "Spirit Multiplier - Elden Ring mod"
InternalName = "SpiritMultiplier"
OriginalFilename = "SpiritMultiplier.dll"
