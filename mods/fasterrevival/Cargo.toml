[package]
name = "fasterrevival"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "FasterRevival"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Faster Revival"
