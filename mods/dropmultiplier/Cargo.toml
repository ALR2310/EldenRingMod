[package]
name = "dropmultiplier"
version = "1.1.0"
edition = "2024"
publish = false

[lib]
name = "DropMultiplier"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Drop Multiplier"
FileDescription = "Drop Multiplier - Elden Ring mod"
InternalName = "DropMultiplier"
OriginalFilename = "DropMultiplier.dll"
