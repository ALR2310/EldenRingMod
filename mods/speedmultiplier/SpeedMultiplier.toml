[General]
# file format version, managed by the mod - don't change
ConfigVersion = 1   

# Key that reloads this config file in-game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show banner at the top of the screen after a reload.
# Errors always show.
ReloadBanner = true


[Player]
# Groups of player actions.
All = 1.0           # all player actions - when not 1, overrides every key below
Walk = 1.1          # walking
Run = 1.2           # running
Sneak = 1.1         # sneaking
Jump = 1.0          # jumping and landing
Roll = 1.1          # rolling, backstepping
Ladder = 1.2        # climbing, sliding
Attack = 1.2        # normal attacks
Critical = 1.0      # critical hits
Skill = 1.2         # weapon skills
Cast = 1.2          # casting sorceries and incantations
Item = 1.0          # using items (flasks, consumables, throwables...)
Other = 1.0         # any action not covered by the keys above


[Torrent]
# Groups of Torrent's actions.
All = 1.0           # all of Torrent's actions - when not 1, overrides every key below
Walk = 1.1          # walking
Run = 1.3           # running
Jump = 1.0          # jumping and landing
Other = 1.0         # any action not covered by the keys above


[Spirit]
# Summoned spirit ashes
All = 1.0           # all of their actions


[Enemy]
# Hostile enemies and bosses
All = 1.0           # all of their actions


# Override: different speeds while the player has a SpEffect and/or is at
# a given equip load.
# Remove the "# " in front of the lines below to use it, and add as
# many [[Override]] blocks as you like.
#
# SpEffect: one id, or a list - on while the player has ANY of them.
# EquipLoad: Light, Medium, Heavy or Overweight (the equip load class in
# the equipment screen), or a list - on while the class is ANY of them.
# Use SpEffect, EquipLoad, or both (then both must hold).
# Then any [Player] / [Torrent] key above, written as Player.<key> or
# Torrent.<key>; the ones left out keep their value above.
# When several overrides are on and set the same key, the lowest one
# in the file wins.
#
# [[Override]]
# SpEffect = [1660000, 1605000]   # Golden Vow or Flame, Grant Me Strength
# Player.Roll = 1.5
# Player.Run = 1.4
# Torrent.Run = 1.4
#
# [[Override]]
# EquipLoad = "Heavy"             # heavy load: slower
# Player.Walk = 0.9
# Player.Run = 0.9

# [[Override]]
# SpEffect = 1660000              # Golden Vow, but only with a light or
# EquipLoad = ["Light", "Medium"] # medium load (both must hold)
# Player.Run = 1.5


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true

# Logs every animation the player plays
SpeedProbe = false

# Logs the player's SpEffect ids when they change
EffectProbe = false

# Logs the character you lock on to (NPC id, type, team, HP)
EnemyProbe = false
