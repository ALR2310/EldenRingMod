[package]
name = "soulsteleport"
version = "1.1.0"
edition = "2024"
publish = false

[lib]
name = "SoulsTeleport"
crate-type = ["cdylib"]

[dependencies]
common = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true
# DX12 overlay + Dear ImGui (same stack as SoulsChat); only the DX12 backend.
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Souls Teleport"
FileDescription = "Souls Teleport - Elden Ring mod"
InternalName = "SoulsTeleport"
OriginalFilename = "SoulsTeleport.dll"
